<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIEM - Tactic Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-mono p-6">

    <!-- Encabezado del SOC -->
     <header class="border-b border-gray-700 pb-4 mb-6">
        <h1 class="text-3xl font-bold text-blue-400">SIEM <span class="text-gray-400 text-xl">- Tactic Monitor</span></h1>
        <p class="text-gray-500 text-sm mt-1">Estado del Servidor. <span class="text-green-500">Operativo</span> | Analista: J. Moo</p>
    </header>

    <!-- Grid Principal -->
     <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Panel de Alertas (Fisica/Quimica) -->
        <div id="panel-alertas" class="bg-gray-800 p-4 rounded border border-gray-700 font-mono text-sm shadow-lg">
            <h2 class="text-lg text-red-400 border-b border-b border-gray-700 pb-2 mb-4">Alertas Criticas</h2>
            <ul class="text-sm space-y-2">
                <li class="bg-gray-700 p-2 rounded">Esperando telemetria...</li>
            </ul>
        </div>

        <!-- Gráfica de Telemetría Vectorial (NUEVO) -->
        <div class="bg-gray-800 p-4 rounded border border-gray-700 shadow-lg md:col-span-2 mb-6 mt-6">
            <h2 class="text-lg text-blue-300 border-b border-gray-700 pb-2 mb-4">Análisis de Volumen (Línea Base vs Anomalías)</h2>
            <div class="relative h-48 w-full">
                <canvas id="graficaTelemetria"></canvas>
            </div>
        </div>

        <!-- Panel de Tráfico (Para Métodos Numéricos / Estructura de Datos) -->
        <div class="bg-gray-800 p-4 rounded border border-gray-700 shadow-lg md:col-span-2">
            <h2 class="text-lg text-blue-300 border-b border-gray-700 pb-2 mb-4">Tráfico de Red en Tiempo Real</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="text-gray-400 bg-gray-700">
                        <tr>
                            <th class="px-4 py-2">Timestamp</th>
                            <th class="px-4 py-2">IP Origen</th>
                            <th class="px-4 py-2">Puerto</th>
                            <th class="px-4 py-2">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-logs">
                        <!-- Aquí inyectaremos los logs falsos más adelante -->
                        <tr class="border-b border-gray-700">
                            <td class="px-4 py-2">10:55:01</td>
                            <td class="px-4 py-2">192.168.1.100</td>
                            <td class="px-4 py-2">80</td>
                            <td class="px-4 py-2 text-green-400">Permitido</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        <!-- Motor de actualización en tiempo real con Debugging -->

        // --- CONFIGURACIÓN INICIAL DE LA GRÁFICA ---
        const contextoGrafica = document.getElementById('graficaTelemetria').getContext('2d');
        const graficaVolumen = new Chart(contextoGrafica, {
            type: 'line',
            data: {
                labels: [], // Aquí irán las horas
                datasets: [{
                    label: 'Peticiones cada 5 seg',
                    data: [], // Aquí irá el volumen matemático
                    borderColor: '#3b82f6', // Azul neón
                    backgroundColor: 'rgba(59, 130, 246, 0.2)', // Azul translúcido
                    borderWidth: 2,
                    tension: 0.3, // Suaviza la curva
                    fill: true,
                    pointRadius: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { ticks: { color: '#9ca3af' }, grid: { color: '#374151' } },
                    y: { ticks: { color: '#9ca3af' }, grid: { color: '#374151' }, beginAtZero: true }
                },
                plugins: {
                    legend: { labels: { color: '#d1d5db' } }
                }
            }
        });

        function buscarTelemetria() {
            fetch('/api/telemetria/')
                .then(respuesta => respuesta.json())
                .then(datos => {
                    // 1. Imprimimos lo que llega del servidor
                    console.log("Datos recibidos:", datos); 
                    
                    const tabla = document.getElementById('tabla-logs');
                    
                    // 2. Verificamos si Javascript encuentra la tabla
                    if (!tabla) {
                        console.error("Error: No se encontró la etiqueta <tbody> en el HTML");
                        return;
                    }

                    const nuevaFila = document.createElement('tr');
                    nuevaFila.className = 'border-b border-gray-700 bg-gray-800 bg-opacity-50';

                    const hora = new Date().toLocaleTimeString();
                    const colorEstado = datos.maliciosa ? 'text-red-500 font-bold' : 'text-green-400';

                    nuevaFila.innerHTML = `
                        <td class="px-4 py-2">${hora}</td>
                        <td class="px-4 py-2 font-mono">${datos.ip}</td>
                        <td class="px-4 py-2">${datos.puerto}</td>
                        <td class="px-4 py-2 ${colorEstado}">${datos.estado}</td>
                    `;

                    tabla.insertBefore(nuevaFila, tabla.firstChild);

                    if (tabla.children.length > 10) {
                        tabla.removeChild(tabla.lastChild);
                    }

                    // --- NUEVA LÓGICA DE ALERTAS CRÍTICAS ---
                    if (datos.maliciosa) {
                        const panelAlertas = document.getElementById('panel-alertas');
                        
                        // Si es la primera alerta, borramos el mensaje por defecto
                        if (panelAlertas.innerText.includes("Esperando")) {
                            panelAlertas.innerHTML = "";
                        }

                        // Creamos el mensaje de alerta en rojo
                        const nuevaAlerta = document.createElement('div');
                        nuevaAlerta.className = 'text-red-400 mb-2 border-l-2 border-red-500 pl-2 bg-red-900 bg-opacity-20 p-1';
                        nuevaAlerta.innerHTML = `[BLOQUEO] ${hora} - Tráfico hostil interceptado | IP: ${datos.ip} | Puerto: ${datos.puerto}`;

                        // Lo insertamos hasta arriba
                        panelAlertas.insertBefore(nuevaAlerta, panelAlertas.firstChild);

                        // Mantenemos el panel limpio, mostrando solo las últimas 5 alertas
                        if (panelAlertas.children.length > 5) {
                            panelAlertas.removeChild(panelAlertas.lastChild);
                        }
                    }

                    // --- NUEVA LÓGICA DE ANOMALÍAS (DDOS) ---
                    if (datos.anomalia_ddos) {
                        const panelAlertas = document.getElementById('panel-alertas');
                        
                        if (panelAlertas.innerText.includes("Esperando")) {
                            panelAlertas.innerHTML = "";
                        }

                        const nuevaAnomalia = document.createElement('div');
                        // Usamos color naranja/amarillo para diferenciar anomalías lógicas de bloqueos estáticos
                        nuevaAnomalia.className = 'text-yellow-400 mb-2 border-l-2 border-yellow-500 pl-2 bg-yellow-900 bg-opacity-20 p-1 font-bold animate-pulse';
                        nuevaAnomalia.innerHTML = `[ANOMALÍA LÓGICA] ${hora} - Pico de tráfico detectado. Peticiones recientes: ${datos.peticiones_5s} (Posible DDoS HTTP Flood)`;

                        panelAlertas.insertBefore(nuevaAnomalia, panelAlertas.firstChild);

                        if (panelAlertas.children.length > 5) {
                            panelAlertas.removeChild(panelAlertas.lastChild);
                        }
                    }

                    // --- NUEVA LÓGICA: DETECCIÓN DE EXFILTRACIÓN (GRADIENTES) ---
                    if (datos.anomalia_exfiltracion) {
                        const panelAlertas = document.getElementById('panel-alertas');
                        
                        if (panelAlertas.innerText.includes("Esperando")) {
                            panelAlertas.innerHTML = "";
                        }

                        const nuevaFuga = document.createElement('div');
                        // Color morado para clasificar ataques de fuga de datos (Data Leak)
                        nuevaFuga.className = 'text-purple-400 mb-2 border-l-2 border-purple-500 pl-2 bg-purple-900 bg-opacity-20 p-1 font-bold';
                        nuevaFuga.innerHTML = `[FUGA DE DATOS] ${hora} - Exfiltración sigilosa detectada. Vector de robo: ${datos.gradiente_fuga} paquetes/seg.`;

                        panelAlertas.insertBefore(nuevaFuga, panelAlertas.firstChild);

                        if (panelAlertas.children.length > 5) {
                            panelAlertas.removeChild(panelAlertas.lastChild);
                        }
                    }

                    // --- ACTUALIZACIÓN DE LA GRÁFICA EN TIEMPO REAL ---
                    graficaVolumen.data.labels.push(hora);
                    graficaVolumen.data.datasets[0].data.push(datos.peticiones_5s);

                    // Mantenemos solo los últimos 15 puntos en la gráfica para que avance
                    if (graficaVolumen.data.labels.length > 15) {
                        graficaVolumen.data.labels.shift();
                        graficaVolumen.data.datasets[0].data.shift();
                    }
                    graficaVolumen.update();

                })
                .catch(error => {
                    // 3. Atrapamos cualquier error del código
                    console.error("Error en la ejecución:", error);
                });
        }

        setInterval(buscarTelemetria, 2000);
    </script>

</body>
</html>
